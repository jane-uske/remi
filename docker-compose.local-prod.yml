services:
  app:
    build: .
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-rem}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rem_ai}
      REDIS_URL: redis://redis:6379
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rem_ai}
      POSTGRES_USER: ${POSTGRES_USER:-rem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - rem_local_prod_pgdata:/var/lib/postgresql/data
      - ./storage/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rem} -d ${POSTGRES_DB:-rem_ai}"]
      interval: 5s
      timeout: 5s
      retries: 8
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - rem_local_prod_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 8
    restart: unless-stopped

volumes:
  rem_local_prod_pgdata:
  rem_local_prod_redisdata:
