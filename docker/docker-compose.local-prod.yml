services:
  app:
    image: remi-ai-app
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        NEXT_PUBLIC_REMI_AUTH_MODE: ${NEXT_PUBLIC_REMI_AUTH_MODE:-}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
        NEXT_PUBLIC_VRM_URL: ${NEXT_PUBLIC_VRM_URL:-}
        NEXT_PUBLIC_VRM_YAW: ${NEXT_PUBLIC_VRM_YAW:-}
        NEXT_PUBLIC_VRM_FRAMING: ${NEXT_PUBLIC_VRM_FRAMING:-}
        NEXT_PUBLIC_VRM_DISABLE_NODE_CONSTRAINT: ${NEXT_PUBLIC_VRM_DISABLE_NODE_CONSTRAINT:-}
        NEXT_PUBLIC_REM_DEVTOOLS: ${NEXT_PUBLIC_REM_DEVTOOLS:-}
    env_file: ${REMI_ENV_FILE:-../.env.local-prod}
    environment:
      NODE_ENV: production
      PORT: 3000
      # 容器时钟对齐用户时区：裸 new Date() 本地化输出曾以 UTC 泄进时间叙事（2026-07-04 案）
      TZ: ${REMI_TZ:-Asia/Shanghai}
      DATABASE_URL: postgresql://${POSTGRES_USER:-rem}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rem_ai}
      REDIS_URL: redis://redis:6379
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Adult plugin dist is built on the host; mount read-only into the container.
      - ${REMI_ADULT_PLUGIN_HOST_PATH:-/Users/rare/Desktop/remi-plugin-adult}:/plugins/remi-plugin-adult:ro
      # ComfyUI workflow JSON (checkpoint names must exist in host ComfyUI models/).
      - ${REMI_REPO_PATH:-/Users/rare/Desktop/remi}/capabilities/image_generation/workflows:/app/capabilities/image_generation/workflows:ro
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rem_ai}
      POSTGRES_USER: ${POSTGRES_USER:-rem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - rem_local_prod_pgdata:/var/lib/postgresql/data
      - ../storage/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rem} -d ${POSTGRES_DB:-rem_ai}"]
      interval: 5s
      timeout: 5s
      retries: 8
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - rem_local_prod_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 8
    restart: unless-stopped

volumes:
  rem_local_prod_pgdata:
    name: ${REMI_LOCAL_PROD_PG_VOLUME:-remi-ai_rem_local_prod_pgdata}
    external: true
  rem_local_prod_redisdata:
    name: ${REMI_LOCAL_PROD_REDIS_VOLUME:-remi-ai_rem_local_prod_redisdata}
    external: true
